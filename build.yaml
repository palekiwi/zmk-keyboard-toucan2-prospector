# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: seeeduino_xiao_ble
    shield: toucan_dongle rgbled_adapter prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter toucan_pet
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_PM_SOFT_OFF=y
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_PM_SOFT_OFF=y
  # Standalone (dongle-less) mode: left half becomes the BLE central and
  # pairs directly with the host. Same shields and keymap as above; role and
  # pointing are overridden via Kconfig. The right half needs no separate
  # build - a peripheral is role-agnostic, so the toucan_right artifact
  # above is flashed unchanged.
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter toucan_pet
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
      -DCONFIG_ZMK_POINTING=y
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
      -DCONFIG_ZMK_SLEEP=y
      -DCONFIG_ZMK_PM_SOFT_OFF=y
    artifact-name: toucan_left_standalone
  - board: seeeduino_xiao_ble
    shield: settings_reset
