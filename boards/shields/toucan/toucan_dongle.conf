CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_ZMK_STUDIO_LOCKING=n

# The dongle owns trackpad_listener, so its input thread runs the whole processor
# chain and invokes behaviors (&kp chords, &mo) -- the deepest path on that thread.
# Zephyr's 1024 default overflows it. The halves carry the same 2048 for this reason.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# The keymap's mouse keys (&mk movement/scroll, &mkp buttons) execute on the
# central for events from both halves, so the mouse behavior drivers must be
# built here as well.
CONFIG_ZMK_MOUSE=y
